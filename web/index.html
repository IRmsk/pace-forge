<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运动世界校园 · 记录看板</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
.msg.warn{color:#f5b942}
.ok{color:#22d3a6}
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1f232c;
    --line: #2a2f3a; --fg: #e6e8ec; --dim: #8b93a1;
    --ok: #3fb950; --bad: #f85149; --accent: #4493f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ---- 登录 ---- */
  #login {
    max-width: 380px; margin: 12vh auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px;
  }
  #login h1 { font-size: 19px; margin: 0 0 6px; font-weight: 600; }
  #login p.sub { color: var(--dim); font-size: 13px; margin: 0 0 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; background: var(--panel2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 11px; background: var(--accent); color: #fff; border: 0;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 14px; min-height: 20px; }
  .msg.warn { color:#f5b942; border-color:#5a4a1e; background:#2a2416; }
.msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }

  /* ---- 主界面 ---- */
  #app { display: none; }
  .topbar {
    display: flex; align-items: center; gap: 14px; padding-bottom: 18px;
    border-bottom: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; font-weight: 700; color: #fff;
  }
  .who { flex: 1; min-width: 180px; }
  .who b { font-size: 15px; }
  .who div { color: var(--dim); font-size: 12px; }
  .ghost {
    width: auto; padding: 7px 14px; background: transparent; color: var(--dim);
    border: 1px solid var(--line); font-weight: 400; font-size: 13px;
  }
  .ghost:hover { color: var(--fg); border-color: var(--dim); }

  .grid { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .panel h2 {
    font-size: 13px; font-weight: 600; color: var(--dim); margin: 0;
    padding: 14px 16px; border-bottom: 1px solid var(--line); letter-spacing: .3px;
  }
  #list { max-height: 62vh; overflow-y: auto; }
  .rec {
    padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .rec:hover { background: var(--panel2); }
  .rec.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .rec .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rec .dist { font-size: 16px; font-weight: 600; }
  .rec .tag { font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .tag.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .tag.bad { background: rgba(248,81,73,.15); color: var(--bad); }
  .rec .r2 { color: var(--dim); font-size: 12px; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .empty { padding: 30px 16px; text-align: center; color: var(--dim); font-size: 13px; }

  #map { height: 42vh; min-height: 300px; background: #0b0d11; }
  #detail { padding: 14px 16px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  .kv span:nth-child(odd) { color: var(--dim); }
  .hint { color: var(--dim); font-size: 12px; padding: 0 16px 14px; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .spin {
    width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: sp .7s linear infinite; display: inline-block; vertical-align: -2px;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

.runform { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.runform label { display: flex; flex-direction: column; font-size: 12px; color: #93a4b8; gap: 4px; }
.runform input { width: 84px; padding: 7px 9px; background: #0e141c; border: 1px solid #223041;
  border-radius: 7px; color: #e6edf3; font-size: 14px; }
.runform button { padding: 8px 16px; background: #22d3a6; color: #06121a; border: 0;
  border-radius: 7px; font-weight: 600; cursor: pointer; height: 36px; }
.runform button:disabled { opacity: .5; cursor: default; }
.planout { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
.planout:empty { display: none; }
.kv { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0;
  border-bottom: 1px solid #161f2b; }
.kv span { color: #7d8ea3; }
.kv b { color: #e6edf3; font-weight: 600; }
.kv b.mono { font-family: ui-monospace, monospace; font-size: 11px; }
.planout .note { grid-column: 1/-1; margin-top: 8px; font-size: 12px; color: #6b7c91; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <h1>运动世界校园</h1>
  <p class="sub">登录后查看跑步记录与轨迹</p>
  <div class="field">
    <label>手机号</label>
    <input id="u" type="tel" autocomplete="username" placeholder="请输入手机号">
  </div>
  <div class="field">
    <label>密码</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="请输入密码">
  </div>
  <button id="btn">登 录</button>
  <div class="msg" id="msg"></div>
</div>

<!-- 主界面 -->
<div id="app" class="wrap">
  <div class="topbar">
    <div class="avatar" id="ava">·</div>
    <div class="who">
      <b id="uname">—</b>
      <div id="uinfo">—</div>
    </div>
    <button class="ghost" id="reload">刷新记录</button>
    <button class="ghost" id="logout">退出</button>
  </div>

  <div class="panel" id="runPanel">
    <h2>刷跑（本地预演）</h2>
    <div class="runform">
      <label>模式<select id="rMode">
        <option value="free">自由路线</option>
        <option value="stadium">操场绕圈</option>
      </select></label>
      <label id="laneWrap" style="display:none">道次<select id="rLane">
        <option>1</option><option>2</option><option>3</option><option>4</option>
        <option>5</option><option>6</option><option>7</option><option>8</option>
      </select></label>
      <label>距离 km<input id="rDist" type="number" value="2.0" step="0.1" min="0.5" max="21"></label>
      <label>时长 分<input id="rDur" type="number" value="12" step="1" min="3" max="180"></label>
      <label>步数<input id="rSteps" type="number" value="2300" step="10" min="100" placeholder="留空则由模型推算"></label>
      <button id="planBtn">生成轨迹</button>
    </div>
    <div id="planOut" class="planout"></div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>跑步记录</h2>
      <div id="list"><div class="empty">加载中…</div></div>
    </div>
    <div>
      <div class="panel">
        <h2>轨迹地图</h2>
        <div id="map"></div>
        <div id="detail" class="hint">选择左侧一条记录查看轨迹</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = id => document.getElementById(id);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '请求失败');
  return j.data;
};

/* ---------- 登录 ---------- */
$('btn').onclick = async () => {
  const u = $('u').value.trim(), p = $('p').value;
  if (!u || !p) return setMsg('手机号和密码都要填', 'err');
  $('btn').disabled = true;
  setMsg('登录中…');
  try {
    const me = await api('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    $('p').value = '';
    enter(me);
  } catch (e) {
    setMsg(e.message, 'err');
  } finally {
    $('btn').disabled = false;
  }
};
$('p').onkeydown = e => { if (e.key === 'Enter') $('btn').click(); };
function setMsg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }

/* ---------- 进入主界面 ---------- */
function enter(me) {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
  $('ava').textContent = (me.name || me.username || '?').slice(0, 1);
  $('uname').textContent = me.name || me.username;
  $('uinfo').textContent = [me.campus_name, me.depart, me.grade_class].filter(Boolean).join(' · ') || '—';
  initMap();
  loadRecords();
}
$('logout').onclick = async () => {
  const btn = $('logout');
  btn.disabled = true;
  btn.textContent = '退出中…';
  try {
    await fetch('/api/logout', { method: 'POST', cache: 'no-store' });
  } catch (_) {}
  // 清掉本地残留，避免任何 form/地图状态带回来
  try { localStorage.clear(); sessionStorage.clear(); } catch (_) {}
  // reload 可能命中缓存，用 replace 强制重新拉
  location.replace(location.pathname + '?t=' + Date.now());
};
$('reload').onclick = loadRecords;

$('rMode').onchange = () => {
  $('laneWrap').style.display = $('rMode').value === 'stadium' ? '' : 'none';
};

$('planBtn').onclick = async () => {
  const dist = parseFloat($('rDist').value);
  const dur = parseFloat($('rDur').value);
  const stepsRaw = $('rSteps').value.trim();
  const steps = stepsRaw === '' ? null : parseInt(stepsRaw, 10);
  if (!(dist > 0) || !(dur > 0)) return setOut('距离和时长要填正数', true);

  const btn = $('planBtn');
  btn.disabled = true;
  setOut('生成中…');
  try {
    const r = await api('/api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        distance: dist, duration: dur,
        steps: (Number.isFinite(steps) && steps > 0) ? steps : 0,
        mode: $('rMode').value, lane: parseInt($('rLane').value, 10) || 1
      })
    });
    setOut('');
    const modeTxt = r.mode === 'stadium' ? `操场第 ${r.lane} 道` : '自由路线';
    const acTxt = r.stepAutocorr != null
      ? `${r.stepAutocorr.toFixed(3)} ${r.stepAutocorr < 0.1 ? '(偏低)' : '(正常)'}`
      : '-';
    const issueHtml = (r.issues && r.issues.length)
      ? r.issues.map(t => {
          const cls = t.includes('致命') ? 'err' : (t.includes('警告') ? 'warn' : '');
          return `<div class="msg ${cls}" style="margin-top:4px">${t}</div>`;
        }).join('')
      : '<div class="msg" style="margin-top:6px">自检全部通过</div>';
    $('planOut').innerHTML = `
      <div class="kv"><span>模式</span><b>${modeTxt}</b></div>
      <div class="kv"><span>实际里程</span><b>${r.actualLength} m</b></div>
      <div class="kv"><span>轨迹点数</span><b>${r.pointCount}</b></div>
      <div class="kv"><span>时间桶</span><b>${r.bucketCount}</b></div>
      <div class="kv"><span>配速 speed</span><b>${r.predictedSpeed}</b></div>
      <div class="kv"><span>平均步频</span><b>${r.avgCadence ?? r.avgStepFreq} 步/分</b></div>
      <div class="kv"><span>步数自相关</span><b>${acTxt}</b></div>
      <div class="kv"><span>消耗</span><b>${r.predictedCalorie} kcal</b></div>
      <div class="kv"><span>完成目标</span><b>${r.complete ? '是' : '否'}</b></div>
      <div class="kv"><span>报文大小</span><b>${(r.payloadBytes/1024).toFixed(1)} KB</b></div>
      <div class="kv"><span>签名</span><b class="mono">${r.signature.slice(0,16)}…</b></div>
      <div class="kv"><span>自检</span><b class="${r.blocked ? 'err' : 'ok'}">${r.issueSummary}</b></div>
      ${issueHtml}
      <div class="note">${r.note}</div>`;
    drawPreview(r.coords);
  } catch (e) {
    setOut(e.message, true);
  } finally {
    btn.disabled = false;
  }
};
function setOut(t, err) {
  const o = $('planOut');
  o.innerHTML = t ? `<div class="msg ${err ? 'err' : ''}">${t}</div>` : '';
}
function drawPreview(coords) {
  if (!map || !coords || !coords.length) return;
  if (previewLayer) { map.removeLayer(previewLayer); }
  previewLayer = L.polyline(coords, { color: '#22d3a6', weight: 4, opacity: 0.9 }).addTo(map);
  map.fitBounds(previewLayer.getBounds(), { padding: [30, 30] });
}

/* ---------- 地图 ---------- */
let map, layer, marker, previewLayer;
function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: true }).setView([30.5, 104.0], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
}

/* ---------- 记录列表 ---------- */
async function loadRecords() {
  $('list').innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
  try {
    const data = await api('/api/records?page=1&size=20&type=1');
    const rows = pickRows(data);
    if (!rows.length) {
      $('list').innerHTML = '<div class="empty">这个学期还没有跑步记录</div>';
      return;
    }
    $('list').innerHTML = rows.map((r, i) => recHtml(r, i)).join('');
    [...document.querySelectorAll('.rec')].forEach((el, i) => {
      el.onclick = () => selectRec(rows[i], el);
    });
    selectRec(rows[0], document.querySelector('.rec'));
  } catch (e) {
    $('list').innerHTML = '<div class="empty" style="color:var(--bad)">' + esc(e.message) + '</div>';
  }
}

/* 列表响应结构在不同版本里可能是 {records:[...]} / {list:[...]} / 直接数组 */
function pickRows(d) {
  if (Array.isArray(d)) return d;
  for (const k of ['records', 'list', 'rows', 'data', 'items']) {
    if (Array.isArray(d?.[k])) return d[k];
  }
  return [];
}

function recHtml(r, i) {
  const dist = num(r.totalDistance ?? r.total_distance ?? r.distance) / 1000;
  const secs = int(r.totalTime ?? r.total_time ?? r.runTime);
  const valid = r.isValid ?? r.is_valid ?? (r.status === 1);
  const start = r.startTime ?? r.start_time;
  return `<div class="rec" data-i="${i}">
    <div class="r1">
      <span class="dist">${dist.toFixed(2)} km</span>
      <span class="tag ${valid ? 'ok' : 'bad'}">${valid ? '有效' : '未达标'}</span>
    </div>
    <div class="r2">
      <span>${fmtDate(start)}</span>
      <span>${fmtDur(secs)}</span>
      <span>${pace(dist, secs)}</span>
    </div>
  </div>`;
}

/* ---------- 单条详情 ---------- */
async function selectRec(r, el) {
  document.querySelectorAll('.rec').forEach(x => x.classList.remove('sel'));
  if (el) el.classList.add('sel');
  const rrid = r.rrid ?? r.id ?? r.recordId;
  layer.clearLayers();
  $('detail').innerHTML = '<span class="spin"></span> 加载轨迹…';
  if (!rrid) { $('detail').textContent = '这条记录没有 rrid'; return; }

  try {
    const d = await api('/api/record/' + rrid);
    const pts = findTrack(d);
    if (pts.length > 1) {
      const line = L.polyline(pts, { color: '#4493f8', weight: 4, opacity: .9 }).addTo(layer);
      L.circleMarker(pts[0], { radius: 6, color: '#3fb950', fillOpacity: 1 }).addTo(layer);
      L.circleMarker(pts[pts.length - 1], { radius: 6, color: '#f85149', fillOpacity: 1 }).addTo(layer);
      map.fitBounds(line.getBounds(), { padding: [24, 24] });
      map.invalidateSize();
      $('detail').innerHTML = detailHtml(d, pts.length);
    } else {
      map.setView([30.5, 104.0], 15);
      $('detail').innerHTML = detailHtml(d, 0) +
        '<div style="margin-top:8px;color:var(--dim)">这条记录没有轨迹坐标（服务端未返回）</div>';
    }
  } catch (e) {
    $('detail').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>';
  }
}

function detailHtml(d, n) {
  const g = (k, alt) => d[k] ?? alt;
  const dist = num(g('totalDistance', g('total_distance'))) / 1000;
  const vdist = num(g('validDistance', g('valid_distance'))) / 1000;
  const secs = int(g('totalTime', g('total_time')));
  const vsecs = int(g('validTime', g('valid_time')));
  const cal = int(g('calorie'));
  const freq = int(g('avgStepFreq', g('avg_step_freq')));
  const reason = g('unCompleteReason', g('uncomplete_reason'));
  const rows = [
    ['总距离', dist.toFixed(2) + ' km'],
    ['有效距离', vdist.toFixed(2) + ' km'],
    ['总时长', fmtDur(secs)],
    ['有效时长', fmtDur(vsecs)],
    ['配速', pace(dist, secs)],
    ['步频', freq ? freq + ' 步/分' : '—'],
    ['消耗', cal ? cal + ' 千卡' : '—'],
    ['轨迹点', n ? n + ' 个' : '无'],
  ];
  if (reason) rows.push(['未达标原因', String(reason)]);
  return '<div class="kv">' + rows.map(([k, v]) => `<span>${k}</span><span>${esc(String(v))}</span>`).join('') + '</div>';
}

/* ---------- 轨迹自动探测 ----------
 * 服务端字段名不稳定，递归扫描 JSON：
 *   1. 形如 "lng,lat,lng,lat,..." 的字符串
 *   2. 形如 [[lng,lat], ...] 的数组
 *   3. 形如 [{lat,lng|lon|latitude,longitude}, ...] 的对象数组
 * 取点数最多的那一个。
 */
function findTrack(obj) {
  let best = [];
  const visit = (v, depth) => {
    if (depth > 6 || v == null) return;
    if (typeof v === 'string') {
      const pts = parseCoordString(v);
      if (pts.length > best.length) best = pts;
      return;
    }
    if (Array.isArray(v)) {
      const pts = parseCoordArray(v);
      if (pts.length > best.length) best = pts;
      v.forEach(x => visit(x, depth + 1));
      return;
    }
    if (typeof v === 'object') {
      Object.values(v).forEach(x => visit(x, depth + 1));
    }
  };
  visit(obj, 0);
  return best;
}

function valid(lat, lng) {
  return Number.isFinite(lat) && Number.isFinite(lng) &&
         Math.abs(lat) <= 90 && Math.abs(lng) <= 180 &&
         !(lat === 0 && lng === 0);
}

function parseCoordString(s) {
  if (s.length < 20 || !/[\d.]/.test(s)) return [];
  // 常见：lng,lat,lng,lat,... 或 lng,lat;lng,lat
  const nums = s.split(/[;,\s]+/).map(Number).filter(n => Number.isFinite(n));
  if (nums.length < 4) return [];
  const out = [];
  for (let i = 0; i + 1 < nums.length; i += 2) {
    const a = nums[i], b = nums[i + 1];
    // 判断哪个是纬度：国内 lat 在 18~54，lng 在 73~136
    if (valid(b, a) && Math.abs(b) < 60) out.push([b, a]);
    else if (valid(a, b) && Math.abs(a) < 60) out.push([a, b]);
  }
  return out;
}

function parseCoordArray(arr) {
  if (!arr.length) return [];
  const first = arr[0];
  if (Array.isArray(first) && first.length >= 2) {
    const out = [];
    for (const p of arr) {
      const a = Number(p[0]), b = Number(p[1]);
      if (valid(b, a) && Math.abs(b) < 60) out.push([b, a]);
      else if (valid(a, b) && Math.abs(a) < 60) out.push([a, b]);
    }
    return out;
  }
  if (first && typeof first === 'object') {
    const out = [];
    for (const p of arr) {
      const lat = num(p.lat ?? p.latitude);
      const lng = num(p.lng ?? p.lon ?? p.longitude);
      if (valid(lat, lng)) out.push([lat, lng]);
    }
    return out;
  }
  return [];
}

/* ---------- 格式化 ---------- */
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const int = v => Math.round(num(v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtDate(ms) {
  const n = num(ms);
  if (!n) return '—';
  const d = new Date(n < 1e12 ? n * 1000 : n);
  const p = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDur(sec) {
  const s = int(sec);
  if (!s) return '—';
  const m = Math.floor(s / 60);
  return `${m}′${String(s % 60).padStart(2, '0')}″`;
}
function pace(km, sec) {
  if (!km || !sec) return '—';
  const p = sec / km;
  const m = Math.floor(p / 60), s = Math.round(p % 60);
  return `${m}′${String(s).padStart(2, '0')}″/km`;
}

(async () => {
  try {
    const me = await api('/api/me');
    enter(me);
  } catch (_) { /* 未登录，停在登录页 */ }
})();
